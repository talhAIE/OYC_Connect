name: Credential leak checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test redacted scanner
        run: python -m unittest discover -s oyc_connect/tools/security -p test_security_scan.py
      - name: Reject secrets and tracked environment files in current source
        run: python oyc_connect/tools/security/scan_secrets.py
      - name: Reject exposed credentials in reachable Git history
        run: python oyc_connect/tools/security/scan_secrets.py --history
